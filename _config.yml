        description: |
          **Out-of-domain generalization for web agents.**
          Studied why web agents degrade on unseen websites and how training data should be selected to close that gap, leading to [Weasel](https://arxiv.org/abs/2605.20291) (ICML 2026).

          **Co-led the LLM subgroup of an accessibility-focused AI docent project.**
          Worked with [Heeseung Yun](https://heeseungyun.com) to manage five researchers and deploy RAG-based systems across three major museums in Seoul; the project was [featured at the Korea Metaverse Festival](https://kidd.co.kr/news/243920).

